<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>My Website Header</h1>
        </header>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <div class="content-container">
            <main>
                <h2>Main Content</h2>
                <p>This is the main area where your primary information goes.</p>
            </main>

            <aside>
                <h3>Sidebar</h3>
                <p>Useful links or extra information here.</p>
            </aside>
        </div>

        <footer>
            <p>&copy; 2026 My Web Project</p>
        </footer>
    </div>

</body>
</html>
