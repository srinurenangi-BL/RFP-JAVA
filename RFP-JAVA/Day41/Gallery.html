<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Photo Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }

        h2 { text-align: center; margin-bottom: 20px; color: #333; }

        /* The Grid Layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .caption {
            padding: 10px;
            text-align: center;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h2>My Photo Gallery</h2>

    <div class="gallery">
        <div class="gallery-item">
            <img src="https://via.placeholder.com/600x400" alt="Landscape 1">
            <div class="caption">Nature View</div>
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/600x400" alt="Landscape 2">
            <div class="caption">Urban Life</div>
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/600x400" alt="Landscape 3">
            <div class="caption">Mountain Peaks</div>
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/600x400" alt="Landscape 4">
            <div class="caption">Ocean Breeze</div>
        </div>
    </div>

</body>
</html>
