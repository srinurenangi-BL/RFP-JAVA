<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined UI Components</title>
    <style>
        /* Base Styles */
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; line-height: 1.6; }
        .section { margin-bottom: 40px; }
        h2 { text-align: center; margin-bottom: 20px; }

        /* 1. Media Object */
        .media-object { display: flex; gap: 15px; background: white; padding: 15px; border-radius: 8px; align-items: center; max-width: 600px; margin: 0 auto 20px; }
        .media-image { width: 50px; height: 50px; background: #3498db; border-radius: 50%; }

        /* 2. Card Layout */
        .card-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* 3. Photo Gallery */
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 800px; margin: 0 auto; }
        .gallery-item { background: #ddd; height: 150px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* --- MEDIA QUERIES (Responsiveness) --- */
        
        /* Mobile: Stack gallery */
        @media (max-width: 600px) {
            .gallery { grid-template-columns: 1fr; }
        }

        /* Desktop: Expand gallery to 4 columns */
        @media (min-width: 900px) {
            .gallery { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div class="section">
        <h2>Media Object</h2>
        <div class="media-object">
            <div class="media-image"></div>
            <div>
                <h4>User Profile</h4>
                <p>This is a standard media object component.</p>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Card Layout</h2>
        <div class="card-container">
            <div class="card"><h3>Card 1</h3><p>Description goes here.</p></div>
            <div class="card"><h3>Card 2</h3><p>Description goes here.</p></div>
            <div class="card"><h3>Card 3</h3><p>Description goes here.</p></div>
        </div>
    </div>

    <div class="section">
        <h2>Responsive Gallery</h2>
        <div class="gallery">
            <div class="gallery-item">IMG 1</div>
            <div class="gallery-item">IMG 2</div>
            <div class="gallery-item">IMG 3</div>
            <div class="gallery-item">IMG 4</div>
        </div>
    </div>

</body>
</html>
