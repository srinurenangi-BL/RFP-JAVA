<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full Employee Payroll Application</title>
    <style>
        .text-error { color: red; font-size: 12px; font-style: italic; }
        .form-content { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; }
        .row-content { margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="form-content">
    <form class="form" id="payrollForm" onreset="resetForm()" onsubmit="save(event)">
        <div class="form-head">Employee Payroll Form</div>
        
        <div class="row-content">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
            <error-output class="text-error" for="text"></error-output>
        </div>

        <div class="row-content">
            <label for="salary">Salary</label>
            <input type="range" id="salary" name="salary" min="30000" max="50000" value="40000">
            <output class="salary-output">40000</output>
        </div>

        <div class="row-content">
            <label>Notes</label>
            <textarea id="notes" name="notes"></textarea>
        </div>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</div>

<script>
    // UC 1: Employee Payroll Class 
    class EmployeePayrollData {
        get id() { return this._id; }
        set id(id) { this._id = id; }
        get name() { return this._name; }
        set name(name) {
            let nameRegex = RegExp('^[A-Z]{1}[a-zA-Z\\s]{2,}$');
            if (nameRegex.test(name)) this._name = name;
            else throw 'Name is Incorrect!';
        }
        get salary() { return this._salary; }
        set salary(salary) { this._salary = salary; }
        get note() { return this._note; }
        set note(note) { this._note = note; }
        get startDate() { return this._startDate; }
        set startDate(startDate) { this._startDate = startDate; }
        
        toString() {
            return `id=${this.id}, name='${this.name}', salary=${this.salary}, note=${this.note}`;
        }
    }

    // UC 2: DOMContentLoaded Event Listeners [cite: 120, 124, 143]
    window.addEventListener('DOMContentLoaded', (event) => {
        const name = document.querySelector('#name');
        const textError = document.querySelector('.text-error');
        name.addEventListener('input', function() {
            try {
                let empData = new EmployeePayrollData();
                empData.name = name.value;
                textError.textContent = "";
            } catch (e) { textError.textContent = e; }
        });

        const salary = document.querySelector('#salary');
        const output = document.querySelector('.salary-output');
        salary.addEventListener('input', () => { output.textContent = salary.value; });
    });

    // UC 3 & 4: Save and Storage [cite: 167, 178, 227, 231]
    function save(event) {
        event.preventDefault();
        try {
            let employeePayrollData = createEmployeePayroll();
            createAndUpdateStorage(employeePayrollData);
            alert("Data Saved Successfully!");
        } catch (e) { console.error(e); }
    }

    const createEmployeePayroll = () => {
        let employeePayrollData = new EmployeePayrollData();
        employeePayrollData.name = getInputValueById('#name');
        employeePayrollData.salary = getInputValueById('#salary');
        employeePayrollData.note = getInputValueById('#notes');
        return employeePayrollData;
    };

    function createAndUpdateStorage(employeePayrollData) {
        let list = JSON.parse(localStorage.getItem("EmployeePayrollList")) || [];
        list.push(employeePayrollData);
        localStorage.setItem("EmployeePayrollList", JSON.stringify(list));
    }

    // Helper Methods [cite: 205, 217, 283, 287]
    const getInputValueById = (id) => document.querySelector(id).value;
    
    // UC 5: Reset Logic [cite: 266, 268]
    function resetForm() {
        document.querySelector('#name').value = '';
        document.querySelector('#notes').value = '';
        document.querySelector('.salary-output').textContent = '40000';
    }
</script>

</body>
</html>
